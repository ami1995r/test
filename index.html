<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>صفحه اصلی - تیکت تئاتر</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/react@18.2.0/umd/react.production.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/react-dom@18.2.0/umd/react-dom.production.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/babel-standalone@7.22.9/babel.min.js"></script>
</head>
<body class="bg-gray-50 font-sans">
  <div id="root"></div>

  <script type="text/babel">
    console.log("Starting React app...");

    function Header() {
      console.log("Rendering Header");
      return (
        <header className="bg-teal-700 text-white shadow-md sticky top-0 z-10">
          <div className="container mx-auto flex justify-between items-center py-4 px-6">
            <div className="text-2xl font-bold">تیکت تئاتر</div>
            <nav className="flex space-x-6">
              <a href="#" className="hover:text-teal-200">رویدادها</a>
              <a href="#" className="hover:text-teal-200">سالن‌ها</a>
              <a href="#" className="hover:text-teal-200">مجله</a>
              <a href="#" className="hover:text-teal-200">درباره ما</a>
            </nav>
            <div>
              <button className="bg-white text-teal-700 px-4 py-2 rounded-lg hover:bg-teal-100">
                ورود / ثبت‌نام
              </button>
            </div>
          </div>
        </header>
      );
    }

    function Banner() {
      console.log("Rendering Banner");
      return (
        <section className="relative bg-teal-800 text-white py-16">
          <div
            className="absolute inset-0 bg-cover bg-center opacity-50"
            style={{ backgroundImage: "url('https://images.unsplash.com/photo-1519167758481-83f1af1f7b98?ixlib=rb-4.0.3&auto=format&fit=crop&w=1350&q=80')" }}
          ></div>
          <div className="container mx-auto text-center relative z-10">
            <h1 className="text-3xl md:text-4xl font-bold mb-4">بلیت تئاترهای مورد علاقه‌تان را بخرید</h1>
            <p className="text-lg mb-6">تجربه‌ای متفاوت از خرید بلیت رویدادهای فرهنگی</p>
            <button className="bg-teal-500 text-white px-6 py-3 rounded-lg hover:bg-teal-400">
              خرید بلیت
            </button>
          </div>
        </section>
      );
    }

    function EventCard({ title, date, location, image }) {
      console.log("Rendering EventCard:", title);
      return (
        <div className="bg-white rounded-lg shadow-md overflow-hidden hover:shadow-lg transition-shadow duration-300">
          <img src={image} alt={title} className="w-full h-48 object-cover" />
          <div className="p-4">
            <h3 className="text-lg font-semibold mb-2">{title}</h3>
            <p className="text-gray-600 text-sm mb-1">{date}</p>
            <p className="text-gray-600 text-sm mb-4">{location}</p>
            <button className="bg-teal-600 text-white px-4 py-2 rounded-lg hover:bg-teal-500 w-full">
              خرید بلیت
            </button>
          </div>
        </div>
      );
    }

    function FeaturedEvents() {
      console.log("Rendering FeaturedEvents");
      const events = [
        {
          title: "نمایش مکبث",
          date: "۱۵ اردیبهشت ۱۴۰۴",
          location: "تئاتر شهر، تهران",
          image: "https://images.unsplash.com/photo-1514525253161-7a46d19cd819?ixlib=rb-4.0.3&auto=format&fit=crop&w=500&q=80",
        },
        {
          title: "کنسرت موسیقی پاپ",
          date: "۲۰ اردیبهشت ۱۴۰۴",
          location: "تالار وحدت، تهران",
          image: "https://images.unsplash.com/photo-1470229722913-7c0e2bbafd92?ixlib=rb-4.0.3&auto=format&fit=crop&w=500&q=80",
        },
        {
          title: "نمایش کمدی عروسکی",
          date: "۲۵ اردیبهشت ۱۴۰۴",
          location: "سالن میلاد، تهران",
          image: "https://images.unsplash.com/photo-1573495627361-d9b8794584f3?ixlib=rb-4.0.3&auto=format&fit=crop&w=500&q=80",
        },
        {
          title: "کارگاه نمایشنامه‌نویسی",
          date: "۳۰ اردیبهشت ۱۴۰۴",
          location: "خانه هنرمندان، تهران",
          image: "https://images.unsplash.com/photo-1503095396549-807759245f35?ixlib=rb-4.0.3&auto=format&fit=crop&w=500&q=80",
        },
      ];

      return (
        <section className="py-12 bg-gray-50">
          <div className="container mx-auto px-6">
            <h2 className="text-2xl font-bold text-center mb-8">رویدادهای پیشنهادی</h2>
            <div className="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-6">
              {events.map((event, index) => (
                <EventCard key={index} {...event} />
              ))}
            </div>
          </div>
        </section>
      );
    }

    function Footer() {
      console.log("Rendering Footer");
      return (
        <footer className="bg-teal-800 text-white py-8">
          <div className="container mx-auto px-6 text-center">
            <h3 className="text-lg font-bold mb-4">تیکت تئاتر</h3>
            <p className="mb-4">ایمیل: info@tickettheater.ir | تلفن: ۰۲۱-۱۲۳۴۵۶۷۸</p>
            <p>© ۱۴۰۴ تیکت تئاتر. تمامی حقوق محفوظ است.</p>
          </div>
        </footer>
      );
    }

    function App() {
      console.log("Rendering App");
      return (
        <div>
          <Header />
          <Banner />
          <FeaturedEvents />
          <Footer />
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
    console.log("App rendered");
  </script>
</body>
</html>
